name: API checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -m "not integration" --cov=main --cov=student_api --cov=audit --cov-report=term-missing --cov-fail-under=80

  integration:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Start API and test real HTTP operations
        env:
          API_BASE_URL: http://127.0.0.1:8000
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"; cat /tmp/api.log' EXIT
          python - <<'PY'
          import time
          import httpx
          for attempt in range(50):
              try:
                  httpx.get("http://127.0.0.1:8000/", timeout=1).raise_for_status()
                  break
              except httpx.HTTPError:
                  time.sleep(0.1)
          else:
              raise SystemExit("API did not become ready")
          PY
          python -m pytest -m integration -v
